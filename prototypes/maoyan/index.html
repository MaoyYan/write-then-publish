<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>猫彦 · Obsidian 排版插件</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#preview">跳到卡片预览</a>
<main class="plugin-stage">
  <aside class="inspector" aria-label="猫彦排版插件面板">
    <header class="plugin-header">
      <div class="brand"><span class="brand-mark">彦</span><div><strong>猫彦排版</strong><small>示例笔记 · 把时间留给内容.md</small></div></div>
      <button class="primary" id="export">导出 <span aria-hidden="true">↗</span></button>
    </header>
    <div class="plugin-status">
      <span><i class="status-dot"></i><span id="save-status">本机草稿</span></span>
      <span class="connection-state">笔记读取待接入</span>
    </div>
    <section class="preview-dock" id="preview" aria-label="卡片预览">
      <div class="preview-heading"><div><span class="eyebrow">图文预览</span><h2>3:4 卡片</h2></div><span class="ratio-label">3:4</span></div>
      <div class="preview-tools"><div class="segmented" aria-label="预览模式"><button id="compare" aria-pressed="true">双主题</button><button id="single" aria-pressed="false">当前主题</button></div></div>
      <div class="formatting-area" id="text-tools">
        <div class="formatting-toolbar" role="toolbar" aria-label="文字格式">
          <button class="tool-button" id="undo" title="撤销" aria-label="撤销" disabled>↶</button>
          <button class="tool-button" id="redo" title="重做" aria-label="重做" disabled>↷</button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button class="tool-button" id="bold" title="加粗" aria-label="加粗" disabled><b>B</b></button>
          <button class="tool-button" id="italic" title="斜体" aria-label="斜体" disabled><i>I</i></button>
          <button class="tool-button" id="underline" title="下划线" aria-label="下划线" disabled><u>U</u></button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button class="tool-button color-trigger" id="text-color-trigger" title="字体颜色" aria-label="字体颜色" aria-expanded="false" aria-controls="text-color-popover" disabled><span class="tool-letter">A</span><i class="color-indicator text-indicator"></i><span class="chevron">⌄</span></button>
          <button class="tool-button color-trigger" id="highlight-trigger" title="背景高亮" aria-label="背景高亮" aria-expanded="false" aria-controls="highlight-popover" disabled><span class="marker-icon">▱</span><i class="color-indicator highlight-indicator"></i><span class="chevron">⌄</span></button>
          <button class="tool-button clear-tool" id="clear" title="清除格式" aria-label="清除格式" disabled>Tx</button>
        </div>
        <div class="color-popover" id="text-color-popover" hidden>
          <strong>字体颜色</strong>
          <div class="swatch-grid" aria-label="字体颜色预设">
            <button class="swatch" data-text-swatch="#252B27" style="--swatch:#252B27" aria-label="墨黑"></button>
            <button class="swatch" data-text-swatch="#117C0D" style="--swatch:#117C0D" aria-label="草木深绿"></button>
            <button class="swatch" data-text-swatch="#0961F6" style="--swatch:#0961F6" aria-label="湖蓝"></button>
            <button class="swatch" data-text-swatch="#6E7932" style="--swatch:#6E7932" aria-label="苔绿"></button>
            <button class="swatch" data-text-swatch="#9A5B35" style="--swatch:#9A5B35" aria-label="陶棕"></button>
            <button class="swatch" data-text-swatch="#7B5D92" style="--swatch:#7B5D92" aria-label="雾紫"></button>
          </div>
          <label class="field-label" for="text-color">自定义色码</label>
          <div class="color-row"><input type="color" id="text-picker" value="#117c0d" aria-label="选择文字颜色"><input id="text-color" value="#117C0D" aria-label="文字 HEX 色码" maxlength="7"><button id="apply-color" disabled>应用</button></div>
        </div>
        <div class="color-popover" id="highlight-popover" hidden>
          <strong>背景高亮</strong>
          <div class="swatch-grid" aria-label="高亮颜色预设">
            <button class="swatch" data-highlight-swatch="#FAC75E" style="--swatch:#FAC75E" aria-label="麦秆暖黄"></button>
            <button class="swatch" data-highlight-swatch="#BDDD22" style="--swatch:#BDDD22" aria-label="嫩绿"></button>
            <button class="swatch" data-highlight-swatch="#BFD8F4" style="--swatch:#BFD8F4" aria-label="浅湖蓝"></button>
            <button class="swatch" data-highlight-swatch="#DCE9CF" style="--swatch:#DCE9CF" aria-label="浅草绿"></button>
            <button class="swatch" data-highlight-swatch="#E9DCC8" style="--swatch:#E9DCC8" aria-label="纸杏"></button>
            <button class="swatch" data-highlight-swatch="#E2D9EA" style="--swatch:#E2D9EA" aria-label="浅雾紫"></button>
          </div>
          <label class="field-label" for="highlight-color">自定义色码</label>
          <div class="color-row"><input type="color" id="highlight-picker" value="#bddd22" aria-label="选择高亮颜色"><input id="highlight-color" value="#BDDD22" aria-label="高亮 HEX 色码" maxlength="7"><button id="apply-highlight" disabled>应用</button></div>
          <label class="field-label" for="opacity">透明度</label>
          <div class="opacity-row"><input id="opacity" type="range" min="0" max="100" value="57"><input id="opacity-number" type="number" min="0" max="100" value="57" aria-label="高亮透明度百分比"><span>%</span></div>
        </div>
        <div class="selection-state"><span id="selection-count">未选中文字</span><span id="selection-text">请先在卡片中拖选文字</span></div>
        <p id="text-error" class="error" role="alert"></p>
      </div>
      <div id="cards" class="cards-grid"></div>
      <p id="font-status" class="font-status"></p>
    </section>
    <section class="settings-section">
      <h3>主题</h3>
      <button class="theme-option" data-theme="wheat" aria-pressed="true"><span class="palette"><i style="background:#F7F5EF"></i><i style="background:#117C0D"></i><i style="background:#FAC75E"></i></span><span><strong>麦浪青野</strong><small>人文 · 暖纸白与深绿</small></span><span class="theme-check">✓</span></button>
      <button class="theme-option" data-theme="lime" aria-pressed="false"><span class="palette"><i style="background:#F6F7F4"></i><i style="background:#BDDD22"></i><i style="background:#0961F6"></i></span><span><strong>荔枝青绿</strong><small>科技 · 冷纸白与湖蓝</small></span><span class="theme-check">✓</span></button>
      <label class="field-label" for="font">当前主题字体</label><select id="font"><option value="wenkai">霞鹜文楷</option><option value="system">原项目系统黑体</option></select>
      <div class="color-fields" id="theme-colors"></div>
      <p id="theme-error" class="error" role="alert"></p>
      <button id="restore-theme">恢复当前内置主题</button>
      <details><summary>保存自定义主题</summary><label class="field-label" for="theme-name">主题名称</label><input id="theme-name" maxlength="30" placeholder="例如：猫彦 · 观察"><button id="save-theme">保存当前配色与字体</button><label class="field-label" for="saved-theme">已保存主题</label><select id="saved-theme"><option value="">选择主题</option></select></details>
    </section>
    <section class="settings-section identity-settings">
      <h3>卡片身份</h3>
      <label class="avatar-upload">选择头像<input type="file" id="avatar" accept="image/png,image/jpeg,image/webp"></label><p id="avatar-error" class="error" role="alert"></p>
      <label class="field-label" for="profile-name">IP 名称</label><input id="profile-name" value="猫彦" maxlength="20">
      <label class="field-label" for="profile-bio">小简介</label><input id="profile-bio" value="" maxlength="50" placeholder="写一句你的简介（可留空）">
      <small class="subtle">头像默认为文字占位，选择本地图片即可替换。</small>
    </section>
    <section id="export-panel" class="export-panel" hidden aria-label="导出方案">
      <div class="panel-heading"><h3>导出到笔记旁边</h3><button id="close-export" aria-label="收起导出方案">×</button></div>
      <p class="notice">文件导出待接入，当前仅预览路径。</p>
      <p>当前主题：<strong id="export-theme"></strong> · PNG · 1728 × 2304</p>
      <pre id="export-path"></pre>
      <button disabled>保存到笔记文件夹（待接入）</button>
    </section>
  </aside>
</main>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
